name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-test-scan:
    env:
      # Job-level so the Sonar step's if: can see whether a token exists.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Runs before setup-java on purpose: Dependency-Check_Action is a Docker container
      # action and inherits the job's environment, so once setup-java exports JAVA_HOME
      # (a host path like /opt/hostedtoolcache/...) the container's own java launcher fails
      # with "JAVA_HOME is not defined correctly".
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ai-helpdesk-platform'
          path: '.'
          format: 'HTML'

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: ignore

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify -B

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      # Needs repo settings: secret SONAR_TOKEN, and variables SONAR_HOST_URL (e.g.
      # https://sonarcloud.io or your SonarQube server) and, for SonarCloud only,
      # SONAR_ORGANIZATION. Skipped when no token is available (not configured yet, or a
      # Dependabot/fork PR, which GitHub never gives secrets to) instead of failing the build.
      # -DskipTests: the tests already ran in the Maven step above.
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B -DskipTests verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=ai-helpdesk
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  # Set repo variable AWS_DEPLOY_ENABLED=true once AWS secrets and ECR exist; until then image push
  # and GitOps update are skipped instead of failing main on missing credentials.
  docker-build-push:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # frontend's Dockerfile/build context don't follow the services/<name>/Dockerfile
        # pattern the other 6 do (see docker-compose.yml) - listing context+dockerfile
        # explicitly per entry avoids computing a wrong path for it at build time.
        include:
          - service: ticket-service
            context: .
            dockerfile: services/ticket-service/Dockerfile
          - service: kb-service
            context: .
            dockerfile: services/kb-service/Dockerfile
          - service: ai-service
            context: .
            dockerfile: services/ai-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - service: analytics-service
            context: .
            dockerfile: services/analytics-service/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REPOSITORY: helpdesk/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/helpdesk/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  gitops-update:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update Helm values with new image tags
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/g" infrastructure/helm/helpdesk/values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/helpdesk/values.yaml
          git commit -m "GitOps: Update image tags to ${{ github.sha }}"
          git push
