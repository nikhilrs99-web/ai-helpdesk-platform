server {
    listen 8080;

    # Same relative-path contract as vite.config.ts's dev proxy: the app always calls
    # /api/..., so it behaves identically under `npm run dev` and this built image.
    # "api-gateway" resolves via Docker's internal DNS (see docker-compose.yml).
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
