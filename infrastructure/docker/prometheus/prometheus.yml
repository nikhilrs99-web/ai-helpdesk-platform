global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'helpdesk-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: 
        - 'ticket-service:8080'
        - 'kb-service:8080'
        - 'notification-service:8080'
        - 'analytics-service:8080'
        - 'ai-service:8083'
        - 'api-gateway:8000'
