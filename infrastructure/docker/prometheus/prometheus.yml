global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'helpdesk-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'ticket-service:8081'
        - 'kb-service:8082'
        - 'notification-service:8084'
        - 'analytics-service:8085'
        - 'ai-service:8083'
        - 'api-gateway:8000'
