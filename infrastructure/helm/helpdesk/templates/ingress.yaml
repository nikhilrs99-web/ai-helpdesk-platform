apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk-ingress
  # No rewrite-target here on purpose: api-gateway's routes (application.yml) match on the
  # literal Path=/api/tickets/** etc. including the /api prefix, and Keycloak expects its own
  # paths (/realms, /resources) unmodified too - stripping the matched prefix, which
  # rewrite-target: / would do, would 404 every request at whichever backend receives it.
spec:
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          # Keycloak's own paths, exposed on the same host so a browser-issued token's `iss`
          # claim (http://<domain>/realms/helpdesk) matches this Ingress - see
          # KEYCLOAK_ISSUER_URI in config.yaml and KC_HOSTNAME in values.yaml's keycloak
          # subchart config, which have to agree with .Values.global.domain here.
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  number: 80
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  number: 80
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
