{{- if .Values.secrets.external.enabled }}
{{- /* Production secrets path (docs/architecture/secrets-management.md): the External Secrets
       Operator (installed separately in the cluster) reads one AWS Secrets Manager secret
       (created by infrastructure/terraform/secrets.tf) via IRSA and materialises it as the
       same "helpdesk-secrets" Kubernetes Secret the Deployments already consume - so no
       credential ever lives in values.yaml or git. config.yaml skips its own placeholder
       Secret when this is enabled. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.secrets.external.serviceAccountName }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.secrets.external.roleArn | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secrets.external.storeName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.external.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secrets.external.serviceAccountName }}
            namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: helpdesk-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.storeName }}
  target:
    name: helpdesk-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.external.remoteKey | quote }}
{{- end }}
