{{- range $name, $svc := dict "ticket-service" .Values.ticketService "api-gateway" .Values.apiGateway "ai-service" .Values.aiService "kb-service" .Values.kbService "notification-service" .Values.notificationService "analytics-service" .Values.analyticsService "frontend" .Values.frontend }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          {{- if $svc.resources }}
          resources:
{{ toYaml $svc.resources | indent 12 }}
          {{- end }}
          {{- /* The frontend is static nginx with no Spring actuator, so it has no
                 liveness/readiness health groups - just prove it's serving something. */}}
          {{- /* Confirmed against a live cluster: these are JVM services doing Flyway
                 migrations against a cold-started Postgres, and can take 60-150+ seconds to
                 come up (observed directly in docker-compose logs - ticket-service alone
                 took over 150s once). A 30s initialDelaySeconds on the liveness probe was
                 killing every one of them mid-startup, before Spring Boot ever opened a
                 port - an endless CrashLoopBackOff that looks like an app bug but isn't.
                 A startupProbe holds off liveness/readiness until the app is actually up,
                 with its own generous budget (periodSeconds * failureThreshold = 5 minutes),
                 then normal fast-interval checks take over for genuine health monitoring. */}}
          startupProbe:
            httpGet:
              path: {{ if eq $name "frontend" }}/{{ else }}/actuator/health/readiness{{ end }}
              port: {{ $svc.port }}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: {{ if eq $name "frontend" }}/{{ else }}/actuator/health/liveness{{ end }}
              port: {{ $svc.port }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ if eq $name "frontend" }}/{{ else }}/actuator/health/readiness{{ end }}
              port: {{ $svc.port }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ $svc.port }}
{{- end }}
