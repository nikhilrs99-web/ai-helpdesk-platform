server:
  port: 8081

spring:
  application:
    name: ticket-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is only compared against the token's `iss` claim, which Keycloak stamps
          # with whatever host the browser used (localhost:8080) - it must match exactly.
          # jwk-set-uri is the actual network call this container makes to fetch signing keys,
          # which needs Docker's internal service DNS since "localhost" here means this container.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/helpdesk}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/helpdesk/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:helpdesk}
    username: ${POSTGRES_USER:helpdesk_app}
    password: ${POSTGRES_PASSWORD:localdevpassword123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    # This app's tables already existed (created by ddl-auto: update through Day 15) before
    # Flyway was introduced - baseline-on-migrate marks whatever's already there as V1 instead
    # of erroring out over a non-empty, unmanaged schema. A genuinely fresh database (no tables
    # yet) just runs V1__baseline_schema.sql for real instead of baselining - see
    # docs/database/schema-notes.md for how both paths were verified.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      # Flyway now owns the schema; Hibernate only checks its entity mappings still match
      # what's actually there instead of silently altering it - see schema-notes.md for why
      # this replaces ddl-auto: update.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    # show-sql only prints the SQL text with ? placeholders - this shows the actual
    # values bound to each ? and the values Hibernate reads back out of the ResultSet.
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
