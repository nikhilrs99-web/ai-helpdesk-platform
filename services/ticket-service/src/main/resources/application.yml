server:
  port: 8081

spring:
  application:
    name: ticket-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/helpdesk
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:helpdesk}
    username: ${POSTGRES_USER:helpdesk_app}
    password: ${POSTGRES_PASSWORD:localdevpassword123}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    # show-sql only prints the SQL text with ? placeholders - this shows the actual
    # values bound to each ? and the values Hibernate reads back out of the ResultSet.
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
