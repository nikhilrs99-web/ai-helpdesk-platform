server:
  port: 8082

spring:
  application:
    name: kb-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is only compared against the token's `iss` claim, which Keycloak stamps
          # with whatever host the browser used (localhost:8080) - it must match exactly.
          # jwk-set-uri is the actual network call this container makes to fetch signing keys,
          # which needs Docker's internal service DNS since "localhost" here means this container.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/helpdesk}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/helpdesk/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:helpdesk}
    username: ${POSTGRES_USER:helpdesk_app}
    password: ${POSTGRES_PASSWORD:localdevpassword123}
  data:
    # @EnableCaching (KbServiceApplication) + spring-boot-starter-data-redis on the classpath
    # means Spring auto-configures a RedisCacheManager for the @Cacheable/@CachePut/@CacheEvict
    # annotations on KnowledgeArticleController - without this host, it defaulted to
    # "localhost", which inside this container means itself, not the redis container, and
    # every cached endpoint call would fail trying to reach a Redis that isn't there.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    # This service's tables live in the same shared "helpdesk" database/public schema as the
    # other services, each with its own migration timeline - a dedicated table name keeps
    # kb-service's Flyway history from colliding with ticket-service's. baseline-version: 0
    # (not 1) so V1 still actually runs and creates this service's tables, since the shared
    # public schema is already non-empty (has ticket-service's tables) by the time this runs.
    table: flyway_schema_history_kb
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
