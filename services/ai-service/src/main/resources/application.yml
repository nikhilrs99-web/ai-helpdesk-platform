server:
  port: 8083

spring:
  application:
    name: ai-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is only compared against the token's `iss` claim, which Keycloak stamps
          # with whatever host the browser used (localhost:8080) - it must match exactly.
          # jwk-set-uri is the actual network call this container makes to fetch signing keys,
          # which needs Docker's internal service DNS since "localhost" here means this container.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/helpdesk}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/helpdesk/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:helpdesk}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    # Shares the "helpdesk" database/public schema with the other services - a dedicated table
    # and a baseline below the real V1 migration keeps this service's history independent and
    # ensures V1 actually runs instead of being skipped as already-baselined.
    enabled: true
    table: flyway_schema_history_ai
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
