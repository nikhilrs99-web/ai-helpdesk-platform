server:
  port: 8000

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/helpdesk
  cloud:
    gateway:
      routes:
        - id: ticket-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/tickets/**
        - id: kb-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/articles/**
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ai/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

